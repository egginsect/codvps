name: Fake VPS

# The fake-VPS black-box suite builds a systemd container and takes many
# CI minutes, so it runs only when started by hand (Actions > Fake VPS >
# Run workflow), not on every push or pull request.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fake-vps:
    name: Fake VPS Black-box Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and run fake-VPS tests
        run: test/fakevps/run.sh
      - name: Upload test logs and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fakevps-logs
          path: test/fakevps/logs/
          retention-days: 7

