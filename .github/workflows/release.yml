name: Release

on:
  push:
    tags:
      - 'v0.*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-X github.com/egginsect/codvps/internal/buildinfo.Version=${VERSION} \
              -X github.com/egginsect/codvps/internal/buildinfo.Commit=${COMMIT} \
              -X github.com/egginsect/codvps/internal/buildinfo.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o dist/codvps-linux-amd64 ./cmd/codvps
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-X github.com/egginsect/codvps/internal/buildinfo.Version=${VERSION} \
              -X github.com/egginsect/codvps/internal/buildinfo.Commit=${COMMIT} \
              -X github.com/egginsect/codvps/internal/buildinfo.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o dist/codvps-linux-arm64 ./cmd/codvps
      - name: Create checksums
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum codvps-linux-amd64 codvps-linux-arm64 install.sh > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/codvps-linux-amd64 \
            dist/codvps-linux-arm64 \
            dist/install.sh \
            dist/SHA256SUMS \
            --title "$TAG" \
            --notes "Release $TAG.

          ## Binaries

          - \`codvps-linux-amd64\`: Linux x86_64 binary
          - \`codvps-linux-arm64\`: Linux ARM64 binary
          - \`install.sh\`: bootstrap installer (\`curl -fsSL .../install.sh | bash\`)
          - \`SHA256SUMS\`: Checksums for verification"
